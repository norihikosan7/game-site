<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>のりくんのゲームサイト</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: linear-gradient(135deg, #dff3ff, #f5e8ff);
    min-height: 100vh;
    text-align: center;
}

header {
    padding: 40px 20px 20px;
}

h1 {
    font-size: 36px;
    color: #1d3557;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    color: #555;
}

.games {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.game {
    display: block;
    background: white;
    margin: 20px 0;
    padding: 25px;
    border-radius: 18px;
    text-decoration: none;
    color: #222;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
}

.game:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.icon {
    font-size: 50px;
}

.title {
    font-size: 25px;
    font-weight: bold;
    margin-top: 10px;
}

.description {
    color: #666;
    margin-top: 8px;
}

footer {
    margin-top: 40px;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🎮 のりくんのゲームサイト</h1>
    <div class="subtitle">
        楽しく遊べるゲームを集めました！
    </div>
</header>

<div class="games">

    <a class="game" href="block-break.html">
    <div class="icon">🧱</div>
    <div class="title">ブロック崩し</div>
    <div class="description">
        ボールを操ってブロックを全部壊そう！
    </div>
</a>

<a class="game" href="sky-striker.html">
    <div class="icon">✈️</div>
    <div class="title">のりくんのスカイストライカー</div>
    <div class="description">
        空を駆け抜けて敵を撃破しよう！
    </div>
    </a>

    <a class="game" href="animal-adventure.html">
        <div class="icon">🐾</div>
        <div class="title">動物アドベンチャー</div>
        <div class="description">
            動物たちと冒険に出発しよう！
        </div>
    </a>

    <a class="game" href="grand-strategy.html">
        <div class="icon">🌏</div>
        <div class="title">グランドストラテジー</div>
        <div class="description">
            世界を舞台に戦略を楽しもう！
        </div>
    </a>

</div>

<footer>
    © 2026 のりくんのゲームサイト
</footer>

</body>
</html>
